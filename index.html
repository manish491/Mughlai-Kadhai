rying vec2 v_texCoord;\n\n// Simplex-style noise helper\nvec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }\nvec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }\nvec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }\nvec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }\n\nfloat snoise(vec3 v) {\n  const vec2 C = vec2(1.0/6.0, 1.0/3.0);\n  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);\n  vec3 i  = floor(v + dot(v, C.yyy));\n  vec3 x0 = v - i + dot(i, C.xxx);\n  vec3 g = step(x0.yzx, x0.xyz);\n  vec3 l = 1.0 - g;\n  vec3 i1 = min(g.xyz, l.zxy);\n  vec3 i2 = max(g.xyz, l.zxy);\n  vec3 x1 = x0 - i1 + C.xxx;\n  vec3 x2 = x0 - i2 + C.yyy;\n  vec3 x3 = x0 - D.yyy;\n  i = mod289(i);\n  vec4 p = permute(permute(permute(\n             i.z + vec4(0.0, i1.z, i2.z, 1.0))\n           + i.y + vec4(0.0, i1.y, i2.y, 1.0))\n           + i.x + vec4(0.0, i1.x, i2.x, 1.0));\n  float n_ = 0.142857142857;\n  vec3  ns = n_ * D.wyz - D.xzx;\n  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);\n  vec4 x_ = floor(j * ns.z);\n  vec4 y_ = floor(j - 7.0 * x_);\n  vec4 x = x_ *ns.x + ns.yyyy;\n  vec4 y = y_ *ns.x + ns.yyyy;\n  vec4 h = 1.0 - abs(x) - abs(y);\n  vec4 b0 = vec4(x.xy, y.xy);\n  vec4 b1 = vec4(x.zw, y.zw);\n  vec4 s0 = floor(b0)*2.0 + 1.0;\n  vec4 s1 = floor(b1)*2.0 + 1.0;\n  vec4 sh = -step(h, vec4(0.0));\n  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;\n  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;\n  vec3 p0 = vec3(a0.xy, h.x);\n  vec3 p1 = vec3(a0.zw, h.y);\n  vec3 p2 = vec3(a1.xy, h.z);\n  vec3 p3 = vec3(a1.zw, h.w);\n  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));\n  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;\n  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);\n  m = m * m;\n  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));\n}\n\nvoid main() {\n    vec2 st = gl_FragCoord.xy / u_resolution.xy;\n    vec2 mouse = u_mouse / u_resolution.xy;\n    float aspect = u_resolution.x / u_resolution.y;\n    vec2 pos = vec2(st.x * aspect, st.y);\n    \n    float t = u_time * 0.15;\n    \n    // Flowing aromatic saffron steam and warm ember smoke\n    float n1 = snoise(vec3(pos * 1.8 + vec2(0.0, -t * 0.8), t * 0.2));\n    float n2 = snoise(vec3(pos * 3.2 + vec2(t * 0.3, -t * 1.2), t * 0.35));\n    float n3 = snoise(vec3(pos * 6.0 + vec2(-t * 0.4, -t * 1.8), t * 0.5));\n    \n    float smoke = n1 * 0.5 + n2 * 0.35 + n3 * 0.15;\n    smoke = smoothstep(-0.2, 0.8, smoke);\n    \n    // Deep royal palette: Onyx black, Imperial ruby, Warm burnished copper, Saffron gold\n    vec3 colOnyx = vec3(0.05, 0.04, 0.035);\n    vec3 colCrimson = vec3(0.25, 0.05, 0.06);\n    vec3 colCopper = vec3(0.72, 0.42, 0.18);\n    vec3 colGold = vec3(0.92, 0.72, 0.28);\n    vec3 colEmber = vec3(0.95, 0.35, 0.10);\n    \n    // Radial glow from bottom center (simulating the hearth / kadhai flame)\n    vec2 kadhaiOrigin = vec2(0.5 * aspect, 0.1);\n    float dist = length(pos - kadhaiOrigin);\n    float flameGlow = exp(-dist * 2.2) * 1.2;\n    \n    // Micro embers sparkling\n    float sparkle = pow(max(0.0, snoise(vec3(pos * 12.0 + vec2(sin(t)*0.2, -t * 2.5), t))), 6.0) * 2.0;\n    \n    vec3 color = mix(colOnyx, colCrimson, clamp(smoke * 0.7 + flameGlow * 0.3, 0.0, 1.0));\n    color = mix(color, colCopper, clamp(smoke * smoke * 0.6 + flameGlow * 0.5, 0.0, 1.0));\n    color += colGold * (smoke * flameGlow * 0.75);\n    color += colEmber * (sparkle * flameGlow);\n    \n    // Subtle vignette\n    float vignette = smoothstep(1.2, 0.2, length(st - vec2(0.5)));\n    color *= (0.65 + 0.35 * vignette);\n    \n    gl_FragColor = vec4(color, 1.0);\n}`;\n  function cs(type, src) {\n    const s = gl.createShader(type);\n    gl.shaderSource(s, src);\n    gl.compileShader(s);\n    return s;\n  }\n  const prog = gl.createProgram();\n  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));\n  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));\n  gl.linkProgra ed journey through seven curated imperial courses featuring hand-pulled warqi rotis, fragrant broth reductions, live table-side charcoal smoke rituals, and rare saffron pairings.\n          </p>\n<!-- Highlights Chips -->\n<div class=\"flex flex-wrap items-center gap-space-sm pt-space-xs\">\n<span class=\"px-space-md py-space-xs rounded-full bg-surface-container-lowest text-primary font-label-sm text-label-sm uppercase tracking-wider\">\n              ✦ Personal Khansama Service\n            </span>\n<span class=\"px-space-md py-space-xs rounded-full bg-surface-container-lowest text-primary font-label-sm text-label-sm uppercase tracking-wider\">\n              ✦ Private Diwan Seating\n            </span>\n<span class=\"px-space-md py-space-xs rounded-full bg-surface-container-lowest text-primary font-label-sm text-label-sm uppercase tracking-wider\">\n              ✦ Sharbats &amp; Kahwa Included\n            </span>\n</div>\n</div>\n<!-- Action / Booking Side -->\n<div class=\"lg:col-span-4 flex flex-col items-start lg:items-end justify-center gap-space-md\">\n<div class=\"text-left lg:text-right\">\n<span class=\"font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider\">All-Inclusive Imperial Fare</span>\n<p class=\"font-display-hero-mobile text-display-hero-mobile text-primary font-bold\">₹ 4,800</p>\n<span class=\"font-label-sm text-label-sm text-on-surface-variant\">Per Noble Guest • Advance booking required</span>\n</div>\n<a class=\"w-full sm:w-auto px-space-xl py-space-md rounded bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md uppercase font-bold tracking-widest text-center shadow-lg transition-transform hover:-translate-y-0.5\" data-path=\"reserve-a-mehfil\" href=\"#\">\n            Reserve Imperial Banquet\n          </a>\n</div>\n</div>\n</div>\n</section>\n<!-- Interactive Floating Tasting Notes Drawer Trigger -->\n<aside class=\"fixed bottom-6 right-6 z-50 transition-all duration-500 transform translate-y-32 opacity-0 pointer-events-none\" id=\"tastingDrawer\">\n<div class=\"bg-surface-container-highest/95 backdrop-blur-xl p-space-md rounded-xl shadow-2xl flex items-center gap-space-md max-w-md\">\n<div class=\"w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary font-bold\">\n<span class=\"material-symbols-outlined text-[20px]\">room_service</span>\n</div>\n<div class=\"flex flex-col\">\n<span class=\"font-label-sm text-label-sm uppercase tracking-wider text-primary\">Tasting Notes Active</span>\n<span class=\"font-headline-sm text-[16px] text-on-surface line-clamp-1\" id=\"drawerTitle\">Dish Added</span>\n</div>\n<a class=\"ml-2 px-space-md py-space-xs rounded bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-wider font-semibold hover:bg-primary-fixed transition-colors whitespace-nowrap\" data-path=\"reserve-a-mehfil\" href=\"#\">\n        Review Order\n      </a>\n</div>\n</aside>\n<!-- Inline Client-Side Micro-Interactions Script -->\n<script>\n    let tastingNotesCount = 0;\n\n    function switchCategory(category) {\n      // Update Tab Visuals\n      const buttons = document.querySelectorAll('.category-btn');\n      buttons.forEach(btn => {\n        if (btn.dataset.cat === category) {\n          btn.classList.add('bg-surface-container-high', 'text-primary');\n          btn.classList.remove('bg-surface-container', 'text-on-surface-variant');\n        } else {\n          btn.classList.remove('bg-surface-container-high', 'text-primary');\n          btn.classList.add('bg-surface-container', 'text-on-surface-variant');\n        }\n      });\n\n      // Filter Cards\n      const cards = document.querySelectorAll('.dish-card');\n      cards.forEach(card => {\n        if (card.dataset.category === category || category === 'all') {\n          card.classList.remove('hidden');\n        } else {\n          card.classList.add('hidden');\n        }\n      });\n    }\n\n    function setFilter(filterType) {\n      // Update Pills\n      const pills = document.querySelectorAll('.filter-pill');\n      pills.forEach(pill => {\n        if (pill.dataset.filter === filterType) {\n          pill.classList.add('bg-primary-container', 'text-on-primary');\n          pill.classList.remove('bg-surface-container-high', 'text-on-surface-variant');\n        } else {\n          pill.classList.remove('bg-primary-container', 'text-on-primary');\n          pill.classList.add('bg-surface-container-high', 'text-on-surface-variant');\n        }\n      });\n\n      // Filter Dishes by Tags\n      const cards = document.querySelectorAll('.dish-card');\n      cards.forEach(card => {\n        const tags = card.dataset.tags || '';\n        if (filterType === 'all' || tags.includes(filterType)) {\n          card.classList.remove('hidden');\n        } else {\n          card.classList.add('hidden');\n        }\n      });\n    }\n\n    function toggleTastingNote(btn, dishName, price) {\n      tastingNotesCount++;\n      const counter = document.getElementById('trayCounter');\n      counter.innerText = `${tastingNotesCount} ${tastingNotesCount === 1 ? 'course' : 'courses'}`;\n\n      // Floating Feedback Drawer\n      const drawer = document.getElementById('tastingDrawer');\n      const drawerTitle = document.getElementById('drawerTitle');\n      drawerTitle.innerText = `${dishName} (${price})`;\n\n      drawer.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');\n\n      // Temporary button state pulse\n      const originalText = btn.innerHTML;\n      btn.innerHTML = `<span class=\"material-symbols-outlined text-[16px] text-tertiary\">check</span> <span>Added to Dastarkhwan</span>`;\n      btn.classList.add('bg-primary-container', 'text-on-primary');\n\n      setTimeout(() => {\n        btn.innerHTML = originalText;\n        btn.classList.remove('bg-primary-container', 'text-on-primary');\n      }, 2000);\n    }\n  <\/script>\n</div></main><footer class=\"w-full bg-surface-contai
